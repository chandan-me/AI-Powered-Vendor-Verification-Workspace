services:
  - type: web
    name: vendorverify-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: true
      - key: DATABASE_URL
        value: sqlite:///./vendorverify.db
      - key: SECRET_KEY
        generateValue: true
