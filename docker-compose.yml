version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vendorverify-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: vendorverify
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendorverify-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql+pymysql://root:password123@db:3306/vendorverify
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - db
    volumes:
      - ./backend/private_uploads:/app/private_uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendorverify-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mysql_data:
